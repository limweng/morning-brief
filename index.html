<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #6e0f1a;
    --bg-deep: #470910;
    --surface: rgba(246, 236, 221, 0.08);
    --surface-solid: #7c1220;
    --border: rgba(212, 175, 90, 0.28);
    --border-strong: rgba(212, 175, 90, 0.55);
    --text: #f6ecdd;
    --text-dim: #d8c3ac;
    --text-faint: #b08a63;
    --accent: #d4af5a;
    --accent-soft: #e8c988;
    --accent-dim: rgba(212, 175, 90, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(212, 175, 90, 0.14), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(212, 175, 90, 0.10), transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/></svg>");
    background-attachment: fixed;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 28px 80px;
  }

  header {
    margin-bottom: 56px;
  }

  header .eyebrow {
    display: block;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1#today-date {
    margin: 0;
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(32px, 6vw, 50px);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  section {
    margin-bottom: 48px;
  }

  h2 {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
    margin: 0 0 18px;
  }

  /* Priorities */
  #priority-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .priority-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .priority-item:focus-within {
    border-color: var(--border-strong);
  }

  .priority-number {
    flex: 0 0 auto;
    font-weight: 700;
    color: var(--text-faint);
    font-size: 15px;
    width: 16px;
  }

  .priority-item input[type="checkbox"] {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .priority-item input[type="text"] {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 4px 0;
  }

  .priority-item input[type="text"]::placeholder {
    color: var(--text-faint);
  }

  .priority-item.done input[type="text"] {
    color: var(--text-faint);
    text-decoration: line-through;
  }

  /* Quote */
  blockquote.quote {
    margin: 0 0 56px;
    padding: 22px 30px;
    border-left: 5px solid var(--accent);
    background: var(--surface);
    border-radius: 4px 16px 16px 4px;
    font-family: 'Playfair Display', 'Georgia', serif;
    font-style: italic;
    font-size: clamp(24px, 3.6vw, 34px);
    line-height: 1.35;
    color: var(--accent-soft);
    font-weight: 700;
  }

  blockquote.quote p {
    margin: 0;
  }

  /* Launch */
  .launch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
  }

  .launch-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 16px;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .launch-card:hover {
    border-color: var(--border-strong);
    background: var(--accent-dim);
    transform: translateY(-2px);
  }

  .launch-icon {
    font-size: 28px;
    line-height: 1;
  }

  .launch-name {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  footer {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 40px;
  }

  @media (max-width: 480px) {
    .page {
      padding: 44px 18px 60px;
    }
    header {
      margin-bottom: 40px;
    }
    section {
      margin-bottom: 38px;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <span class="eyebrow">Morning Brief</span>
    <h1 id="today-date"></h1>
  </header>

  <section class="priorities">
    <h2>Today's Top 3</h2>
    <ol id="priority-list"></ol>
  </section>

  <blockquote class="quote">
    <p id="quote-text"></p>
  </blockquote>

  <section class="launch">
    <h2>Launch</h2>
    <div class="launch-grid" id="launch-grid"></div>
  </section>

  <footer>Set this as your homepage and start every day here.</footer>

</div>

<script>
  // ---- Quotes: add more here, one will be picked at random each load ----
  const QUOTES = [
    "Vision without execution is hallucination."
  ];

  // ---- Default priorities shown when no entry exists yet for the day ----
  const DEFAULT_PRIORITIES = [
    "Finish Claude Code course",
    "Send emails to Kaizen Project Team",
    "Have dinner with my ex-colleague"
  ];

  // ---- Launch tools: add more here without touching layout code ----
  const LAUNCH_TOOLS = [
    { name: "Gmail", url: "https://mail.google.com", icon: "\u{1F4E7}" },
    { name: "Slack", url: "https://slack.com/signin", icon: "\u{1F4AC}" },
    { name: "Sheets", url: "https://sheets.google.com", icon: "\u{1F4CA}" }
  ];

  // ---- Date header ----
  function renderDate() {
    const today = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', options);
  }

  // ---- Quote ----
  function renderQuote() {
    const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('quote-text').textContent = `“${quote}”`;
  }

  // ---- Priorities (persisted per-day in localStorage) ----
  const PRIORITY_KEY = 'morningBrief.priorities.v2';
  const PRIORITY_COUNT = 3;

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function loadPriorities() {
    const raw = localStorage.getItem(PRIORITY_KEY);
    const blank = { date: todayKey(), items: Array.from({ length: PRIORITY_COUNT }, (_, i) => ({ text: DEFAULT_PRIORITIES[i] || '', done: false })) };
    if (!raw) return blank;
    try {
      const parsed = JSON.parse(raw);
      if (parsed.date !== todayKey()) return blank;
      return parsed;
    } catch (e) {
      return blank;
    }
  }

  function savePriorities(state) {
    localStorage.setItem(PRIORITY_KEY, JSON.stringify(state));
  }

  function renderPriorities() {
    const state = loadPriorities();
    const list = document.getElementById('priority-list');
    list.innerHTML = '';

    state.items.forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'priority-item' + (item.done ? ' done' : '');

      const num = document.createElement('span');
      num.className = 'priority-number';
      num.textContent = (i + 1) + '.';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => {
        const current = loadPriorities();
        current.items[i].done = checkbox.checked;
        savePriorities(current);
        li.classList.toggle('done', checkbox.checked);
      });

      const text = document.createElement('input');
      text.type = 'text';
      text.placeholder = `Priority ${i + 1}`;
      text.value = item.text;
      text.addEventListener('input', () => {
        const current = loadPriorities();
        current.items[i].text = text.value;
        savePriorities(current);
      });

      li.appendChild(num);
      li.appendChild(checkbox);
      li.appendChild(text);
      list.appendChild(li);
    });

    savePriorities(state);
  }

  // ---- Launch cards ----
  function renderLaunch() {
    const grid = document.getElementById('launch-grid');
    grid.innerHTML = '';
    LAUNCH_TOOLS.forEach(tool => {
      const a = document.createElement('a');
      a.className = 'launch-card';
      a.href = tool.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const icon = document.createElement('span');
      icon.className = 'launch-icon';
      icon.textContent = tool.icon;

      const name = document.createElement('span');
      name.className = 'launch-name';
      name.textContent = tool.name;

      a.appendChild(icon);
      a.appendChild(name);
      grid.appendChild(a);
    });
  }

  renderDate();
  renderQuote();
  renderPriorities();
  renderLaunch();
</script>

</body>
</html>
